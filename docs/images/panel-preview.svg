<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a3a"/>
      <stop offset="1" stop-color="#0d1230"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17e6c8"/>
      <stop offset="1" stop-color="#2dd4ff"/>
    </linearGradient>
  </defs>

  <!-- Panel -->
  <rect x="8" y="8" width="624" height="764" rx="24" fill="url(#panelBg)" stroke="#24304f" stroke-width="2"/>

  <!-- Header -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="#17e6c8" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="17" fill="none" stroke="#17e6c8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="64" cy="64" r="8" fill="none" stroke="#17e6c8" stroke-width="1.5" opacity="0.8"/>
  <circle cx="64" cy="64" r="3.5" fill="#17e6c8"/>
  <text x="104" y="60" font-size="26" font-weight="700" fill="#ffffff">RepoRadar</text>
  <text x="104" y="86" font-size="14" fill="#8b93b8">facebook / react</text>

  <!-- Score gauge -->
  <circle cx="320" cy="220" r="86" fill="none" stroke="#24304f" stroke-width="14"/>
  <circle cx="320" cy="220" r="86" fill="none" stroke="#17e6c8" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="507 540" transform="rotate(-90 320 220)"/>
  <text x="320" y="228" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle">94</text>
  <text x="320" y="262" font-size="17" font-weight="600" fill="#17e6c8" text-anchor="middle">Grade A</text>
  <text x="320" y="330" font-size="14" fill="#8b93b8" text-anchor="middle">Coverage 92% · High confidence</text>

  <!-- Category bars -->
  <g font-size="15" fill="#ffffff">
    <text x="48" y="392">Maintenance</text>
    <rect x="48" y="404" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="404" width="461" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="416" font-weight="700" fill="#17e6c8" text-anchor="end">96</text>

    <text x="48" y="458">Community</text>
    <rect x="48" y="470" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="470" width="422" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="482" font-weight="700" fill="#17e6c8" text-anchor="end">88</text>

    <text x="48" y="524">Issues &amp; PRs</text>
    <rect x="48" y="536" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="536" width="442" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="548" font-weight="700" fill="#17e6c8" text-anchor="end">92</text>

    <text x="48" y="590">Releases</text>
    <rect x="48" y="602" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="602" width="408" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="614" font-weight="700" fill="#17e6c8" text-anchor="end">85</text>

    <text x="48" y="656">Documentation</text>
    <rect x="48" y="668" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="668" width="432" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="680" font-weight="700" fill="#17e6c8" text-anchor="end">90</text>

    <text x="48" y="722">Adoption</text>
    <rect x="48" y="734" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="734" width="466" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="746" font-weight="700" fill="#17e6c8" text-anchor="end">97</text>
  </g>
</svg>
