<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a3a"/>
      <stop offset="1" stop-color="#0d1230"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17e6c8"/>
      <stop offset="1" stop-color="#2dd4ff"/>
    </linearGradient>
  </defs>

  <!-- Panel -->
  <rect x="8" y="8" width="624" height="1064" rx="24" fill="url(#panelBg)" stroke="#24304f" stroke-width="2"/>

  <!-- Header -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="#17e6c8" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="17" fill="none" stroke="#17e6c8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="64" cy="64" r="8" fill="none" stroke="#17e6c8" stroke-width="1.5" opacity="0.8"/>
  <circle cx="64" cy="64" r="3.5" fill="#17e6c8"/>
  <text x="104" y="60" font-size="26" font-weight="700" fill="#ffffff">RepoRadar</text>
  <text x="104" y="86" font-size="14" fill="#8b93b8">facebook / react</text>

  <!-- Verdict banner -->
  <rect x="32" y="116" width="576" height="78" rx="12" fill="#12261d" stroke="#3fb950" stroke-width="2"/>
  <text x="56" y="152" font-size="24" font-weight="800" fill="#56d364">Use it</text>
  <text x="56" y="178" font-size="13" fill="#8b93b8">Adoption signal based on public repository evidence</text>

  <!-- Score gauge -->
  <circle cx="320" cy="300" r="64" fill="none" stroke="#24304f" stroke-width="12"/>
  <circle cx="320" cy="300" r="64" fill="none" stroke="#17e6c8" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="378 402" transform="rotate(-90 320 300)"/>
  <text x="320" y="308" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">94</text>
  <text x="320" y="336" font-size="15" font-weight="600" fill="#17e6c8" text-anchor="middle">Grade A</text>
  <text x="320" y="392" font-size="13" fill="#8b93b8" text-anchor="middle">Coverage 92% · High confidence</text>

  <!-- Trajectory -->
  <text x="48" y="436" font-size="16" font-weight="700" fill="#ffffff">Trajectory — Growing</text>
  <g fill="#58a6ff">
    <rect x="48" y="470" width="18" height="14" rx="2"/>
    <rect x="72" y="464" width="18" height="20" rx="2"/>
    <rect x="96" y="468" width="18" height="16" rx="2"/>
    <rect x="120" y="458" width="18" height="26" rx="2"/>
    <rect x="144" y="462" width="18" height="22" rx="2"/>
    <rect x="168" y="452" width="18" height="32" rx="2"/>
    <rect x="192" y="448" width="18" height="36" rx="2"/>
    <rect x="216" y="442" width="18" height="42" rx="2"/>
    <rect x="240" y="438" width="18" height="46" rx="2"/>
    <rect x="264" y="432" width="18" height="52" rx="2"/>
    <rect x="288" y="428" width="18" height="56" rx="2"/>
    <rect x="312" y="422" width="18" height="62" rx="2"/>
  </g>
  <line x1="48" y1="476" x2="330" y2="428" stroke="#17e6c8" stroke-width="2.5"/>
  <text x="348" y="452" font-size="13" fill="#8b93b8">about 12 commits a week</text>
  <text x="348" y="472" font-size="13" fill="#8b93b8">in 3 months</text>

  <!-- Category bars -->
  <g font-size="15" fill="#ffffff">
    <text x="48" y="540">Maintenance</text>
    <rect x="48" y="552" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="552" width="461" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="564" font-weight="700" fill="#17e6c8" text-anchor="end">96</text>

    <text x="48" y="600">Community</text>
    <rect x="48" y="612" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="612" width="422" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="624" font-weight="700" fill="#17e6c8" text-anchor="end">88</text>

    <text x="48" y="660">Issues &amp; PRs</text>
    <rect x="48" y="672" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="672" width="442" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="684" font-weight="700" fill="#17e6c8" text-anchor="end">92</text>

    <text x="48" y="720">Releases</text>
    <rect x="48" y="732" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="732" width="408" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="744" font-weight="700" fill="#17e6c8" text-anchor="end">85</text>

    <text x="48" y="780">Documentation</text>
    <rect x="48" y="792" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="792" width="432" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="804" font-weight="700" fill="#17e6c8" text-anchor="end">90</text>

    <text x="48" y="840">Adoption</text>
    <rect x="48" y="852" width="480" height="12" rx="6" fill="#24304f"/>
    <rect x="48" y="852" width="466" height="12" rx="6" fill="url(#barFill)"/>
    <text x="544" y="864" font-weight="700" fill="#17e6c8" text-anchor="end">97</text>
  </g>

  <!-- Supply chain -->
  <rect x="32" y="900" width="576" height="96" rx="12" fill="#131a3a" stroke="#24304f" stroke-width="1.5"/>
  <text x="56" y="934" font-size="16" font-weight="700" fill="#ffffff">Supply chain</text>
  <text x="56" y="962" font-size="15" fill="#ffffff">Risk: <tspan font-weight="700" fill="#56d364">Low</tspan> · 100 / 100</text>
  <text x="56" y="984" font-size="13" fill="#8b93b8">12 dependencies scanned · 0 vulnerabilities · 0 abandoned</text>
</svg>
